# This workflow runs JUnit tests automatically when code is pushed to GitHub

name: Java CI with Maven - Part 3 Tests

on:
  push:
    branches: [ main, master, development, part3 ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Check out the repository code
    - name: Checkout repository
      uses: actions/checkout@v3
    
    # Step 2: Set up JDK 11
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    
    # Step 3: Display Maven version
    - name: Display Maven version
      run: mvn --version
    
    # Step 4: Compile the Java project
    - name: Compile Java code
      run: mvn clean compile
      continue-on-error: false
    
    # Step 5: Run JUnit tests for Part 3
    - name: Run Part 3 JUnit Tests
      run: mvn test
      continue-on-error: false
    
    # Step 6: Generate test report
    - name: Publish Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Part 3 JUnit Test Results
        path: target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true
    
    # Step 7: Upload test results as artifacts
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: part3-test-results
        path: |
          target/surefire-reports/
          target/test-classes/
    
    # Step 8: Upload coverage report (if using JaCoCo)
    - name: Generate Coverage Report
      run: mvn jacoco:report
      continue-on-error: true
    
    # Step 9: Upload coverage
    - name: Upload Coverage
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: target/site/jacoco/
    
    # Step 10: Check test results
    - name: Check Test Results
      run: |
        echo "Checking test results..."
        if [ -d "target/surefire-reports" ]; then
          echo "Test reports found:"
          ls -la target/surefire-reports/
          echo "Test execution completed!"
        else
          echo "No test reports found!"
          exit 1
        fi
    
    # Step 11: Verify all required tests passed
    - name: Verify Part 3 Requirements
      run: |
        echo "==================================="
        echo "Part 3 Test Verification"
        echo "==================================="
        echo "Required tests:"
        echo "1. testSentMessagesArrayPopulated"
        echo "2. testDisplayLongestMessage"
        echo "3. testSearchByMessageID"
        echo "4. testSearchByRecipient"
        echo "5. testDeleteByMessageHash"
        echo "6. testDisplayReport"
        echo "7. testArraysSynchronized"
        echo "8. testMessageHashFormat"
        echo "9. testDisregardedMessages"
        echo "10. testStoredMessages"
        echo "==================================="
        echo "All tests must pass for full marks!"
        echo "==================================="
